<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>PWM Event Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600&display=swap" rel="stylesheet">
<style>:root{--p:#7367F0;--bg:#F5F7FC;--tx:#1E293B;--t2:#64748B;--bd:#E7ECF3}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);font:14px Inter,system-ui,sans-serif;color:var(--tx);padding:16px}
.c{width:100%;max-width:380px;background:#fff;border:1px solid var(--bd);border-radius:20px;box-shadow:0 12px 32px rgba(30,41,59,.10);padding:28px}.lg{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#7367F0,#9C8CFF);color:#fff;display:grid;place-items:center;font-weight:600;margin-bottom:14px}
h1{font:600 20px Poppins,sans-serif;margin:0 0 4px}p{margin:0 0 18px;color:var(--t2);font-size:13px}label{display:block;font-size:12px;font-weight:500;margin:12px 0 6px}input[type=text],input[type=password]{width:100%;padding:11px 12px;border:1px solid var(--bd);border-radius:10px;font:14px Inter,sans-serif}
input:focus{outline:2px solid var(--p);outline-offset:1px}.rm{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:13px;color:var(--t2)}button{width:100%;margin-top:18px;padding:12px;border:0;border-radius:10px;background:var(--p);color:#fff;font:600 14px Inter,sans-serif;cursor:pointer}button:disabled{opacity:.6}
.er{color:#EA5455;font-size:13px;margin-top:10px;min-height:18px}</style></head><body>
